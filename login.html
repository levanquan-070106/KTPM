<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Đăng nhập – KTPMUD</title>
  <!-- Google Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',system-ui,sans-serif;background:#f9fafb;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .login-wrap{width:100%;max-width:400px}
    .login-logo{text-align:center;margin-bottom:28px}
    .login-logo .mark{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;background:#111827;border-radius:10px;font-size:24px;margin-bottom:12px}
    .login-logo h1{font-size:20px;font-weight:800;color:#111827}
    .login-logo p{font-size:13px;color:#6b7280;margin-top:3px}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:28px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
    .card h2{font-size:16px;font-weight:700;margin-bottom:4px}
    .card .sub{font-size:13px;color:#6b7280;margin-bottom:20px}
    .form-group{margin-bottom:14px}
    label{display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:5px}
    input{width:100%;padding:9px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;outline:none;font-family:inherit;transition:border-color .15s}
    input:focus{border-color:#374151;box-shadow:0 0 0 3px rgba(0,0,0,.06)}
    input::placeholder{color:#9ca3af}
    .btn-login{width:100%;padding:10px;background:#111827;color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:700;cursor:pointer;margin-top:4px;transition:background .15s;font-family:inherit}
    .btn-login:hover{background:#1f2937}
    .error{background:#fef2f2;border:1px solid #fecaca;color:#dc2626;border-radius:6px;padding:10px 12px;font-size:13px;margin-bottom:14px;display:none;line-height:1.4}
    .error.show{display:block}

    /* Google Button Area */
    .divider-text{display:flex;align-items:center;text-align:center;margin:18px 0;color:#9ca3af;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px}
    .divider-text::before,.divider-text::after{content:'';flex:1;border-bottom:1px solid #e5e7eb}
    .divider-text:not(:empty)::before{margin-right:10px}
    .divider-text:not(:empty)::after{margin-left:10px}
    .google-btn-wrap{display:flex;flex-direction:column;align-items:center;width:100%;min-height:44px;justify-content:center}
    .google-custom-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:9px 14px;background:#fff;border:1px solid #d1d5db;border-radius:6px;font-size:13px;font-weight:600;color:#374151;cursor:pointer;transition:all .15s;font-family:inherit}
    .google-custom-btn:hover{background:#f9fafb;border-color:#9ca3af}
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-logo">
      <div class="mark">📐</div>
      <h1>KTPMUD</h1>
      <p>Hệ thống Quản lý Tiến độ Project · ĐHBK Hà Nội</p>
    </div>

    <div class="card">
      <h2>Đăng nhập</h2>
      <p class="sub">Sử dụng tài khoản Google trường cấp hoặc tài khoản hệ thống</p>
      
      <div class="error" id="err">Email hoặc mật khẩu không đúng!</div>

      <!-- Đăng nhập bằng Google OAuth -->
      <div class="google-btn-wrap">
        <div id="g_id_onload"
          data-client_id="1082282000930-8bu128kvnfl06ds4dehs4cnt4f7r75rc.apps.googleusercontent.com"
          data-context="signin"
          data-ux_mode="popup"
          data-callback="handleGoogleCredentialResponse"
          data-auto_prompt="false">
        </div>
        <div class="g_id_signin"
          data-type="standard"
          data-shape="rectangular"
          data-theme="outline"
          data-text="signin_with"
          data-size="large"
          data-logo_alignment="left"
          data-width="342">
        </div>
      </div>

      <div class="divider-text">hoặc đăng nhập bằng mật khẩu</div>

      <form onsubmit="doLogin(event)">
        <div class="form-group">
          <label>Email đăng nhập</label>
          <input id="email" type="text" placeholder="example@gmail.com hoặc MSSV" autocomplete="email" required/>
        </div>
        <div class="form-group">
          <label>Mật khẩu</label>
          <input id="pwd" type="password" placeholder="••••••••" autocomplete="current-password" required/>
        </div>
        <button type="submit" class="btn-login">Đăng nhập</button>
      </form>
    </div>
  </div>

  <script src="data.js"></script>
  <script>
    seedIfNeeded();
    if (DB.session()) window.location.href = 'dashboard.html';

    // ── XỬ LÝ ĐĂNG NHẬP GOOGLE OAUTH ──────────────────────────
    function parseJwt(token) {
      try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        return JSON.parse(jsonPayload);
      } catch (e) {
        return null;
      }
    }

    async function handleGoogleCredentialResponse(response) {
      const errEl = document.getElementById('err');
      errEl.classList.remove('show');

      if (!response || !response.credential) {
        errEl.textContent = 'Không nhận được thông tin xác thực từ Google!';
        errEl.classList.add('show');
        return;
      }

      const payload = parseJwt(response.credential);
      if (!payload || !payload.email) {
        errEl.textContent = 'Không thể giải mã tài khoản Google!';
        errEl.classList.add('show');
        return;
      }

      const googleEmail = payload.email.toLowerCase().trim();
      const googleName  = payload.name || '';

      // 1. Thử gửi lên SQLite Server (nếu đang online)
      if (location.protocol.startsWith('http')) {
        await syncFromSQLite();
        const res = await _api('/api/auth/google', 'POST', { email: googleEmail, name: googleName });
        if (res && res.success && res.user) {
          DB.setSession(res.user);
          window.location.href = 'dashboard.html';
          return;
        } else if (res && res.message) {
          errEl.textContent = res.message;
          errEl.classList.add('show');
          return;
        }
      }

      // 2. Fallback xử lý offline / local database
      let u = DB.findUser(googleEmail);
      if (u) {
        DB.setSession(u);
        window.location.href = 'dashboard.html';
        return;
      }

      errEl.textContent = `Tài khoản Google (${googleEmail}) chưa có trong danh sách lớp học nào! Vui lòng liên hệ Giảng viên.`;
      errEl.classList.add('show');
    }

    // ── ĐĂNG NHẬP TRUYỀN THỐNG BẰNG EMAIL & PASSWORD ─────────
    async function doLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const pwd = document.getElementById('pwd').value;
      const errEl = document.getElementById('err');
      errEl.classList.remove('show');
      
      // Đồng bộ & khôi phục dữ liệu (nếu server vừa thức dậy) trước khi xác thực
      if (location.protocol.startsWith('http')) {
        await syncFromSQLite();
        const res = await _api('/api/auth/login', 'POST', { email, password: pwd });
        if (res && res.success && res.user) {
          DB.setSession(res.user);
          window.location.href = 'dashboard.html';
          return;
        }
      }

      let u = DB.findUser(email);
      if (!u) {
        seedIfNeeded(true);
        u = DB.findUser(email);
      }

      if (!u || u.password !== pwd) {
        errEl.textContent = 'Email hoặc mật khẩu không đúng!';
        errEl.classList.add('show');
        return;
      }
      DB.setSession(u);
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
