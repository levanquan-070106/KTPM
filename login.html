<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Đăng nhập – KTPMUD</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',system-ui,sans-serif;background:#f9fafb;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .login-wrap{width:100%;max-width:400px}
    .login-logo{text-align:center;margin-bottom:28px}
    .login-logo .mark{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;background:#111827;border-radius:10px;font-size:24px;margin-bottom:12px}
    .login-logo h1{font-size:20px;font-weight:800;color:#111827}
    .login-logo p{font-size:13px;color:#6b7280;margin-top:3px}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:28px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
    .card h2{font-size:16px;font-weight:700;margin-bottom:4px}
    .card .sub{font-size:13px;color:#6b7280;margin-bottom:22px}
    .form-group{margin-bottom:14px}
    label{display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:5px}
    input{width:100%;padding:9px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;outline:none;font-family:inherit;transition:border-color .15s}
    input:focus{border-color:#374151;box-shadow:0 0 0 3px rgba(0,0,0,.06)}
    input::placeholder{color:#9ca3af}
    .btn-login{width:100%;padding:10px;background:#111827;color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:700;cursor:pointer;margin-top:4px;transition:background .15s;font-family:inherit}
    .btn-login:hover{background:#1f2937}
    .error{background:#fef2f2;border:1px solid #fecaca;color:#dc2626;border-radius:6px;padding:10px 12px;font-size:13px;margin-bottom:14px;display:none}
    .error.show{display:block}
    .demo-section{margin-top:20px}
    .demo-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#9ca3af;margin-bottom:10px;text-align:center}
    .demo-grid{display:flex;flex-direction:column;gap:6px}
    .demo-btn{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:6px;cursor:pointer;font-family:inherit;transition:border-color .15s,background .15s;text-align:left;width:100%}
    .demo-btn:hover{background:#f3f4f6;border-color:#9ca3af}
    .demo-av{width:30px;height:30px;border-radius:50%;background:#111827;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
    .demo-info{flex:1}
    .demo-name{font-size:13px;font-weight:600;color:#111827}
    .demo-role{font-size:11px;color:#6b7280}
    .demo-email{font-size:11px;color:#9ca3af}
    .divider{display:flex;align-items:center;gap:10px;margin:18px 0}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:#e5e7eb}
    .divider span{font-size:11px;color:#9ca3af;white-space:nowrap}
    .role-tag{display:inline-block;padding:2px 6px;border-radius:99px;font-size:10px;font-weight:700}
    .rt-gv{background:#111827;color:#fff}
    .rt-nt{background:#f3f4f6;color:#374151;border:1px solid #d1d5db}
    .rt-sv{background:#fff;color:#374151;border:1px solid #d1d5db}
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-logo">
      <div class="mark">📐</div>
      <h1>KTPMUD</h1>
      <p>Hệ thống Quản lý Tiến độ Project · ĐHBK Hà Nội</p>
    </div>

    <div class="card">
      <h2>Đăng nhập</h2>
      <p class="sub">Vui lòng đăng nhập để tiếp tục</p>
      <div class="error" id="err">Email hoặc mật khẩu không đúng!</div>
      <form onsubmit="doLogin(event)">
        <div class="form-group">
          <label>Email</label>
          <input id="email" type="email" placeholder="example@edu.vn" autocomplete="email" required/>
        </div>
        <div class="form-group">
          <label>Mật khẩu</label>
          <input id="pwd" type="password" placeholder="••••••••" autocomplete="current-password" required/>
        </div>
        <button type="submit" class="btn-login">Đăng nhập</button>
      </form>

      <div class="divider"><span>tài khoản demo</span></div>
      <div class="demo-grid">
        <button class="demo-btn" onclick="quickLogin('gv1@edu.vn','123456')">
          <div class="demo-av">HH</div>
          <div class="demo-info">
            <div class="demo-name">TS. Hoàng Quang Huy <span class="role-tag rt-gv">GV</span></div>
            <div class="demo-email">gv1@edu.vn · 2 lớp phụ trách</div>
          </div>
        </button>
        <button class="demo-btn" onclick="quickLogin('nt1@edu.vn','123456')">
          <div class="demo-av">LQ</div>
          <div class="demo-info">
            <div class="demo-name">Lê Văn Quân <span class="role-tag rt-nt">NT</span></div>
            <div class="demo-email">nt1@edu.vn · Nhóm 19 – K68A</div>
          </div>
        </button>
        <button class="demo-btn" onclick="quickLogin('sv1@edu.vn','123456')">
          <div class="demo-av">ĐN</div>
          <div class="demo-info">
            <div class="demo-name">Đỗ Xuân Nguyện <span class="role-tag rt-sv">SV</span></div>
            <div class="demo-email">sv1@edu.vn · Nhóm 19 – K68A</div>
          </div>
        </button>
      </div>
      <div style="text-align:center;margin-top:16px">
        <button type="button" onclick="resetDemoData()" style="background:none;border:none;color:#9ca3af;font-size:11px;cursor:pointer;text-decoration:underline;font-family:inherit">
          🔄 Đặt lại dữ liệu mẫu
        </button>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script>
    seedIfNeeded();
    if (DB.session()) window.location.href = 'dashboard.html';

    async function doLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const pwd = document.getElementById('pwd').value;
      
      // Xác thực qua SQLite API khi chạy trên máy chủ
      if (location.protocol.startsWith('http')) {
        const res = await _api('/api/auth/login', 'POST', { email, password: pwd });
        if (res && res.success && res.user) {
          await syncFromSQLite();
          document.getElementById('err').classList.remove('show');
          DB.setSession(res.user);
          window.location.href = 'dashboard.html';
          return;
        }
      }

      let u = DB.findUser(email);
      if (!u) {
        seedIfNeeded(true);
        u = DB.findUser(email);
      }

      if (!u || u.password !== pwd) {
        document.getElementById('err').classList.add('show');
        return;
      }
      document.getElementById('err').classList.remove('show');
      DB.setSession(u);
      window.location.href = 'dashboard.html';
    }

    function quickLogin(email, pwd) {
      seedIfNeeded();
      document.getElementById('email').value = email;
      document.getElementById('pwd').value = pwd;
      document.querySelector('form').requestSubmit();
    }

    function resetDemoData() {
      seedIfNeeded(true);
      alert('Đã khôi phục dữ liệu mẫu thành công! Bạn có thể chọn 1 trong 3 tài khoản demo bên dưới.');
      location.reload();
    }
  </script>
</body>
</html>
