<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Nhóm dự án – KTPMUD</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="app"></div>
<div id="toast-stack" class="toast-stack"></div>

<!-- Modal thêm/sửa nhóm (chọn cả Nhóm trưởng và danh sách Thành viên) -->
<div class="modal-overlay" id="m-group">
  <div class="modal modal-lg">
    <div class="modal-header">
      <div class="modal-title" id="m-group-title">➕ Tạo nhóm dự án mới</div>
      <button class="modal-close" onclick="closeModal('m-group')">✕</button>
    </div>
    <form onsubmit="saveGroup(event)">
      <input type="hidden" id="g-id"/>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Tên nhóm <span class="form-required">*</span></label>
          <input id="g-name" class="form-control" placeholder="VD: Nhóm 01" required/>
        </div>
        <div class="form-group">
          <label class="form-label">Lớp học <span class="form-required">*</span></label>
          <select id="g-class" class="form-control" required></select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Tên đề tài dự án <span class="form-required">*</span></label>
        <input id="g-project" class="form-control" placeholder="Nhập tên đề tài dự án..." required/>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Công nghệ sử dụng</label>
          <input id="g-tech" class="form-control" placeholder="React, Node.js, SQLite..."/>
        </div>
        <div class="form-group">
          <label class="form-label">Nhóm trưởng <span class="form-required">*</span></label>
          <select id="g-leader" class="form-control" onchange="onLeaderChange(this.value)" required>
            <option value="">-- Chọn Nhóm trưởng --</option>
          </select>
        </div>
      </div>

      <!-- Chọn thành viên nhóm -->
      <div class="form-group">
        <div class="flex items-center justify-between mb-1">
          <label class="form-label" style="margin-bottom:0">👥 Chọn thành viên trong nhóm</label>
          <span class="text-xs text-muted" id="selected-count">0 thành viên đã chọn</span>
        </div>
        <input type="text" id="member-search" class="form-control mb-2" placeholder="🔍 Tìm nhanh sinh viên theo tên hoặc email..." oninput="filterMemberList(this.value)" style="font-size:12px;padding:6px 10px"/>
        <div id="member-checklist" style="max-height:190px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px;background:var(--gray-50);display:flex;flex-direction:column;gap:6px">
        </div>
        <div class="form-hint">Tích chọn các sinh viên thuộc nhóm này (Nhóm trưởng sẽ tự động được thêm vào nhóm)</div>
      </div>

      <div class="form-group">
        <label class="form-label">Mô tả dự án</label>
        <textarea id="g-desc" class="form-control" rows="2" placeholder="Mô tả mục tiêu và phạm vi dự án..."></textarea>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal('m-group')">Hủy</button>
        <button type="submit" class="btn btn-primary">💾 Lưu nhóm dự án</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal quản lý nhanh thành viên của 1 nhóm -->
<div class="modal-overlay" id="m-members">
  <div class="modal modal-md">
    <div class="modal-header">
      <div class="modal-title" id="m-mem-title">👥 Thành viên nhóm</div>
      <button class="modal-close" onclick="closeModal('m-members')">✕</button>
    </div>
    <input type="hidden" id="mem-gid"/>
    <div id="m-mem-list" style="margin-bottom:16px"></div>

    <div class="divider"></div>
    <div class="form-group">
      <label class="form-label">➕ Thêm sinh viên vào nhóm này</label>
      <div class="flex gap-2">
        <select id="mem-add-sel" class="form-control" style="flex:1">
          <option value="">-- Chọn sinh viên --</option>
        </select>
        <button class="btn btn-primary" onclick="quickAddMember()">Thêm</button>
      </div>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="layout.js"></script>
<script>
const user = initPage('Nhóm dự án', 'groups');
if (user.role !== 'giaovien') navigate('dashboard.html');

function render() {
  const el = document.getElementById('page-content');
  const cid = DB.curClassId();
  const myClasses = DB.classes().filter(c => c.lecturerId === user.id);
  const allMyGroups = DB.groups().filter(g => myClasses.some(c => c.id === g.classId));
  const groups = cid ? DB.groupsByClass(cid) : allMyGroups;
  const reports = DB.reports();
  const week = currentWeek();

  // Đồng bộ dropdown trên topbar nếu có
  const topSel = document.getElementById('class-switcher');
  if (topSel) {
    const rawCur = cid || 'all';
    topSel.innerHTML = `<option value="all" ${rawCur==='all'?'selected':''}>Tất cả các lớp (${myClasses.length})</option>` +
      myClasses.map(c => `<option value="${c.id}" ${c.id===rawCur?'selected':''}>${c.name}</option>`).join('');
  }

  el.innerHTML = `
    <div class="page-header-row">
      <div>
        <h1>👥 Quản lý Nhóm dự án</h1>
        <p class="page-desc">${groups.length} nhóm · ${cid ? (DB.findClass(cid)?.name || '') : 'Tất cả các lớp'}</p>
      </div>
      <button class="btn btn-primary" onclick="openGroupModal()">➕ Tạo nhóm & Thêm thành viên</button>
    </div>

    <!-- Bộ lọc nhanh theo Lớp học -->
    <div class="flex gap-2 mb-4" style="flex-wrap:wrap">
      <button class="btn ${!cid ? 'btn-primary' : 'btn-secondary'} btn-sm" onclick="switchClass('all')">
        🌐 Tất cả các lớp (${allMyGroups.length})
      </button>
      ${myClasses.map(c => {
        const cnt = DB.groupsByClass(c.id).length;
        return `<button class="btn ${cid === c.id ? 'btn-primary' : 'btn-secondary'} btn-sm" onclick="switchClass('${c.id}')">
          🏫 ${c.name} (${cnt})
        </button>`;
      }).join('')}
    </div>

    <div class="stat-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:20px">
      <div class="stat-card"><div class="stat-icon si-black">👥</div><div><div class="stat-val">${groups.length}</div><div class="stat-lbl">Tổng nhóm</div></div></div>
      <div class="stat-card"><div class="stat-icon si-gray">🎓</div><div><div class="stat-val">${groups.reduce((s,g)=>s+g.members.length,0)}</div><div class="stat-lbl">Sinh viên</div></div></div>
      <div class="stat-card"><div class="stat-icon si-gray">📋</div><div><div class="stat-val">${reports.filter(r=>groups.some(g=>g.id===r.groupId)&&r.status==='submitted').length}</div><div class="stat-lbl">BC chờ chấm</div></div></div>
      <div class="stat-card"><div class="stat-icon si-white">🏆</div><div><div class="stat-val">${groups.filter(g=>DB.gradeByGroup(g.id)?.totalScore!=null).length}</div><div class="stat-lbl">Đã có điểm</div></div></div>
    </div>

    ${groups.length === 0 ? `
      <div class="empty" style="padding:60px">
        <div class="empty-icon">👥</div>
        <h3>Chưa có nhóm dự án nào${cid ? ' trong lớp ' + (DB.findClass(cid)?.name || '') : ''}</h3>
        <p>${cid && allMyGroups.length > 0
          ? `Hiện có <strong>${allMyGroups.length} nhóm</strong> đang nằm ở lớp học khác. Bạn có thể bấm xem tất cả các lớp hoặc tạo nhóm mới cho lớp này.`
          : 'Hãy bấm nút bên dưới để tạo nhóm và phân công thành viên'}</p>
        <div class="flex gap-2 justify-center mt-3">
          ${cid && allMyGroups.length > 0 ? `<button class="btn btn-secondary" onclick="switchClass('all')">🌐 Xem tất cả các lớp (${allMyGroups.length} nhóm)</button>` : ''}
          <button class="btn btn-primary" onclick="openGroupModal()">➕ Tạo nhóm đầu tiên</button>
        </div>
      </div>
    ` : `
      <div class="grid-auto">
        ${groups.map(g => {
          const leader = DB.findUserById(g.leaderId);
          const members = g.members.map(id => DB.findUserById(id)).filter(Boolean);
          const gReps = reports.filter(r => r.groupId === g.id);
          const submitted = gReps.filter(r => r.status !== 'draft').length;
          const pending = gReps.filter(r => r.status === 'submitted').length;
          const grade = DB.gradeByGroup(g.id);
          const prog = Math.min(100, Math.round(submitted / week * 100));
          const cls = DB.findClass(g.classId);

          return `<div class="card">
            <div class="card-header">
              <div>
                <div class="card-title">${g.name}</div>
                <div class="card-subtitle">${cls?.name || ''} · NT: <strong>${leader?.name || 'Chưa chọn'}</strong></div>
              </div>
              <div class="flex gap-1">
                ${pending > 0 ? `<span class="badge badge-warning">${pending} chờ</span>` : ''}
                ${grade?.totalScore != null ? `<span class="font-black ${scoreClass(grade.totalScore)}">${grade.totalScore}</span>` : ''}
              </div>
            </div>

            <div class="text-sm font-semibold mb-1 truncate" title="${g.project}">${g.project}</div>
            <div class="chip mb-3" style="font-size:11px">⚙️ ${g.tech || 'Chưa cập nhật'}</div>

            <!-- Danh sách thành viên hiển thị rõ tên -->
            <div style="background:var(--gray-50);padding:8px 10px;border-radius:var(--radius-sm);margin-bottom:12px">
              <div class="flex items-center justify-between mb-1">
                <span class="text-xs font-semibold text-secondary">Thành viên (${members.length})</span>
                <button class="btn btn-ghost btn-sm" style="padding:2px 6px;font-size:11px" onclick="openMembersModal('${g.id}')">+ Thêm / Sửa TV</button>
              </div>
              <div style="display:flex;flex-wrap:wrap;gap:4px">
                ${members.map(m => `
                  <span class="chip" style="background:#fff;border:1px solid var(--border);font-size:11px">
                    ${m.id === g.leaderId ? '👑 ' : ''}${m.name}
                  </span>
                `).join('') || '<span class="text-xs text-muted">Chưa có thành viên</span>'}
              </div>
            </div>

            <div class="flex items-center justify-between text-xs text-muted mb-1">
              <span>Tiến độ nộp BC</span><span>${submitted}/${week} tuần</span>
            </div>
            <div class="progress mb-3"><div class="progress-bar" style="width:${prog}%"></div></div>

            <div class="flex gap-2">
              <button class="btn btn-secondary btn-sm" style="flex:1" onclick="openGroupModal('${g.id}')">✏️ Sửa nhóm</button>
              <button class="btn btn-secondary btn-sm" style="flex:1" onclick="openMembersModal('${g.id}')">👥 Thành viên</button>
              <button class="btn btn-primary btn-sm" onclick="navigate('reports.html')" title="Xem báo cáo">📋</button>
              <button class="btn btn-danger btn-sm btn-icon-sm" onclick="delGroup('${g.id}')" title="Xóa nhóm">🗑️</button>
            </div>
          </div>`;
        }).join('')}
      </div>
    `}
  `;
}

// ── Mở modal tạo/sửa nhóm ──
let currentEditingGroupId = '';
let selectedMemberIds = new Set();

window.openGroupModal = function(id = '') {
  currentEditingGroupId = id;
  const g = id ? DB.findGroup(id) : null;
  document.getElementById('m-group-title').textContent = g ? `✏️ Sửa ${g.name}` : '➕ Tạo nhóm dự án mới';
  document.getElementById('g-id').value = id;
  document.getElementById('g-name').value = g?.name || '';
  document.getElementById('g-project').value = g?.project || '';
  document.getElementById('g-tech').value = g?.tech || '';
  document.getElementById('g-desc').value = g?.description || '';
  document.getElementById('member-search').value = '';

  const cls = DB.classes().filter(c => c.lecturerId === user.id);
  const cSel = document.getElementById('g-class');
  cSel.innerHTML = cls.map(c => `<option value="${c.id}" ${g?.classId === c.id || DB.curClassId() === c.id ? 'selected' : ''}>${c.name}</option>`).join('');

  const students = DB.users().filter(u => u.role === 'nhomt' || u.role === 'sinhvien');
  const lSel = document.getElementById('g-leader');
  lSel.innerHTML = '<option value="">-- Chọn Nhóm trưởng --</option>' +
    students.map(u => `<option value="${u.id}" ${g?.leaderId === u.id ? 'selected' : ''}>${u.name} (${u.email})</option>`).join('');

  selectedMemberIds = new Set(g?.members || []);
  renderMemberChecklist('');
  openModal('m-group');
};

window.onLeaderChange = function(leaderId) {
  if (leaderId) {
    selectedMemberIds.add(leaderId);
    renderMemberChecklist(document.getElementById('member-search').value);
  }
};

window.toggleMemberCheck = function(uid, checked) {
  if (checked) selectedMemberIds.add(uid);
  else {
    const leaderId = document.getElementById('g-leader').value;
    if (uid === leaderId) {
      showToast('Nhóm trưởng bắt buộc phải nằm trong danh sách thành viên!', 'warning');
      renderMemberChecklist(document.getElementById('member-search').value);
      return;
    }
    selectedMemberIds.delete(uid);
  }
  updateSelectedCount();
};

function updateSelectedCount() {
  const el = document.getElementById('selected-count');
  if (el) el.textContent = `${selectedMemberIds.size} thành viên đã chọn`;
}

window.filterMemberList = function(query) {
  renderMemberChecklist(query);
};

function renderMemberChecklist(query = '') {
  const students = DB.users().filter(u => u.role === 'nhomt' || u.role === 'sinhvien');
  const validClasses = DB.classes();
  const allGroups = DB.groups().filter(grp => validClasses.some(c => c.id === grp.classId));
  const q = query.trim().toLowerCase();
  const filtered = students.filter(u => !q || u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q));
  const leaderId = document.getElementById('g-leader')?.value;

  const container = document.getElementById('member-checklist');
  if (filtered.length === 0) {
    container.innerHTML = '<div class="text-xs text-muted text-center py-2">Không tìm thấy sinh viên phù hợp</div>';
    updateSelectedCount();
    return;
  }

  container.innerHTML = filtered.map(u => {
    const isChecked = selectedMemberIds.has(u.id);
    const isLeader = u.id === leaderId;
    const otherGroup = allGroups.find(grp => grp.id !== currentEditingGroupId && grp.members.includes(u.id));
    const otherCls = otherGroup ? DB.findClass(otherGroup.classId) : null;

    return `
      <label style="display:flex;align-items:center;justify-content:space-between;padding:6px 8px;background:#fff;border:1px solid ${isChecked ? 'var(--gray-900)' : 'var(--border)'};border-radius:5px;cursor:pointer;font-size:12px">
        <div class="flex items-center gap-2">
          <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleMemberCheck('${u.id}', this.checked)" style="width:15px;height:15px;cursor:pointer"/>
          <span class="font-semibold">${u.name}</span>
          <span class="text-muted">(${u.email})</span>
        </div>
        <div class="flex gap-1">
          ${isLeader ? '<span class="badge badge-black">👑 Nhóm trưởng</span>' : ''}
          ${otherGroup
            ? `<span class="badge badge-gray" title="Thuộc lớp ${otherCls?.name || ''}">Đang ở ${otherGroup.name}${otherCls ? ' · ' + otherCls.name : ''}</span>`
            : '<span class="badge badge-outline">Chưa có nhóm</span>'}
        </div>
      </label>
    `;
  }).join('');
  updateSelectedCount();
}

window.saveGroup = function(e) {
  e.preventDefault();
  const id = document.getElementById('g-id').value;
  const name = document.getElementById('g-name').value.trim();
  const classId = document.getElementById('g-class').value;
  const project = document.getElementById('g-project').value.trim();
  const leaderId = document.getElementById('g-leader').value;

  if (!name || !classId || !project) { showToast('Vui lòng điền đầy đủ thông tin!', 'error'); return; }
  if (!leaderId) { showToast('Vui lòng chọn Nhóm trưởng!', 'error'); return; }

  selectedMemberIds.add(leaderId);
  const members = Array.from(selectedMemberIds);

  // Tự động gỡ các thành viên được chọn khỏi nhóm cũ (nếu trước đó đang ở nhóm khác)
  DB.groups().forEach(oldGrp => {
    if (oldGrp.id !== id && oldGrp.members.some(m => members.includes(m))) {
      const remain = oldGrp.members.filter(m => !members.includes(m));
      const newOldLeader = remain.includes(oldGrp.leaderId) ? oldGrp.leaderId : (remain[0] || '');
      DB.updateGroup({ id: oldGrp.id, members: remain, leaderId: newOldLeader });
    }
  });

  // Cập nhật role của leader thành nhomt
  DB.updateUser({ id: leaderId, role: 'nhomt' });

  const obj = {
    name, classId, project,
    tech: document.getElementById('g-tech').value.trim(),
    description: document.getElementById('g-desc').value.trim(),
    leaderId,
    members
  };

  if (id) {
    DB.updateGroup({ id, ...obj });
    showToast(`✅ Đã cập nhật ${name} (${members.length} thành viên)!`, 'success');
  } else {
    DB.addGroup({ id: uid(), ...obj, createdAt: new Date().toISOString() });
    showToast(`✅ Đã tạo ${name} với ${members.length} thành viên!`, 'success');
  }
  closeModal('m-group');
  render();
};

// ── Modal quản lý nhanh thành viên ──
window.openMembersModal = function(gid) {
  const g = DB.findGroup(gid);
  if (!g) return;
  document.getElementById('mem-gid').value = gid;
  document.getElementById('m-mem-title').textContent = `👥 Thành viên – ${g.name} (${g.members.length})`;

  const members = g.members.map(id => DB.findUserById(id)).filter(Boolean);
  document.getElementById('m-mem-list').innerHTML = members.length === 0 ?
    '<div class="empty"><p>Chưa có thành viên nào</p></div>' :
    `<div style="display:flex;flex-direction:column;gap:8px">
      ${members.map(m => {
        const isLeader = m.id === g.leaderId;
        return `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:var(--gray-50);border-radius:var(--radius-sm);border:1px solid var(--border)">
            <div class="flex items-center gap-2">
              <div class="avatar" style="width:28px;height:28px;font-size:10px;background:${avatarBg(m.name)}">${getInitials(m.name)}</div>
              <div>
                <div class="font-semibold text-sm">${m.name} ${isLeader ? '<span class="badge badge-black" style="margin-left:4px">👑 NT</span>' : ''}</div>
                <div class="text-xs text-muted">${m.email}</div>
              </div>
            </div>
            <div class="flex gap-1">
              ${!isLeader ? `
                <button class="btn btn-secondary btn-sm" onclick="setAsLeader('${g.id}','${m.id}')" title="Đặt làm Nhóm trưởng">👑 Đặt làm NT</button>
                <button class="btn btn-danger btn-sm btn-icon-sm" onclick="quickRemoveMember('${g.id}','${m.id}')" title="Xóa khỏi nhóm">✕</button>
              ` : ''}
            </div>
          </div>
        `;
      }).join('')}
    </div>`;

  // Populate dropdown sinh viên chưa ở trong nhóm này
  const available = DB.users().filter(u => (u.role === 'sinhvien' || u.role === 'nhomt') && !g.members.includes(u.id));
  const sel = document.getElementById('mem-add-sel');
  sel.innerHTML = '<option value="">-- Chọn sinh viên để thêm vào nhóm --</option>' +
    available.map(u => {
      const curGrp = DB.groupOfUser(u.id);
      const curCls = curGrp ? DB.findClass(curGrp.classId) : null;
      return `<option value="${u.id}">${u.name} (${u.email})${curGrp ? ' - Đang ở ' + curGrp.name + (curCls ? ' · ' + curCls.name : '') : ' - Chưa có nhóm'}</option>`;
    }).join('');

  openModal('m-members');
};

window.quickAddMember = function() {
  const gid = document.getElementById('mem-gid').value;
  const uid = document.getElementById('mem-add-sel').value;
  if (!uid) { showToast('Vui lòng chọn sinh viên!', 'error'); return; }
  const g = DB.findGroup(gid);
  if (!g) return;

  // Gỡ khỏi nhóm cũ nếu có
  DB.groups().forEach(oldGrp => {
    if (oldGrp.id !== gid && oldGrp.members.includes(uid)) {
      const remain = oldGrp.members.filter(m => m !== uid);
      DB.updateGroup({ id: oldGrp.id, members: remain });
    }
  });

  const updated = [...g.members, uid];
  DB.updateGroup({ id: gid, members: updated });
  showToast('✅ Đã thêm thành viên vào nhóm!', 'success');
  openMembersModal(gid);
  render();
};

window.quickRemoveMember = function(gid, uid) {
  const g = DB.findGroup(gid);
  if (!g) return;
  const updated = g.members.filter(id => id !== uid);
  DB.updateGroup({ id: gid, members: updated });
  showToast('✅ Đã xóa thành viên khỏi nhóm!', 'success');
  openMembersModal(gid);
  render();
};

window.setAsLeader = function(gid, uid) {
  const g = DB.findGroup(gid);
  if (!g) return;
  if (g.leaderId) DB.updateUser({ id: g.leaderId, role: 'sinhvien' });
  DB.updateUser({ id: uid, role: 'nhomt' });
  DB.updateGroup({ id: gid, leaderId: uid });
  showToast('✅ Đã đổi Nhóm trưởng!', 'success');
  openMembersModal(gid);
  render();
};

window.delGroup = function(id) {
  if (!confirm('Xóa nhóm này? Toàn bộ báo cáo và công việc sẽ bị xóa!')) return;
  DB.deleteGroup(id);
  showToast('✅ Đã xóa nhóm!', 'success');
  render();
};

render();
</script>
</body>
</html>
