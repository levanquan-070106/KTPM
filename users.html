<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Quản lý tài khoản – KTPMUD</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="app"></div>
<div id="toast-stack" class="toast-stack"></div>

<!-- Modal thêm/sửa người dùng -->
<div class="modal-overlay" id="m-user">
  <div class="modal modal-md">
    <div class="modal-header">
      <div class="modal-title" id="m-user-title">➕ Thêm tài khoản</div>
      <button class="modal-close" onclick="closeModal('m-user')">✕</button>
    </div>
    <form onsubmit="saveUser(event)">
      <input type="hidden" id="u-id"/>
      <div class="form-group">
        <label class="form-label">Họ và tên <span class="form-required">*</span></label>
        <input id="u-name" class="form-control" placeholder="Nguyễn Văn A" required/>
      </div>
      <div class="form-group">
        <label class="form-label">Email <span class="form-required">*</span></label>
        <input id="u-email" class="form-control" type="email" placeholder="example@edu.vn" required/>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Mật khẩu <span id="pwd-hint" class="form-hint" style="display:none">(để trống = giữ nguyên)</span></label>
          <input id="u-pwd" class="form-control" type="password" placeholder="••••••••"/>
        </div>
        <div class="form-group">
          <label class="form-label">Vai trò <span class="form-required">*</span></label>
          <select id="u-role" class="form-control" onchange="toggleRoleFields(this.value)" required>
            <option value="sinhvien">🎓 Sinh viên</option>
            <option value="nhomt">👑 Nhóm trưởng</option>
            <option value="giaovien">👨‍🏫 Giảng viên</option>
          </select>
        </div>
      </div>

      <!-- Chọn Lớp học & Nhóm dự án (dành cho Sinh viên / Nhóm trưởng) -->
      <div class="form-row" id="u-class-group-wrap">
        <div class="form-group">
          <label class="form-label">🏫 Thuộc Lớp học <span class="form-required">*</span></label>
          <select id="u-class" class="form-control" onchange="onUserClassChange(this.value)">
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">👥 Phân vào nhóm (cùng lớp)</label>
          <select id="u-group" class="form-control">
            <option value="">-- Chưa phân nhóm --</option>
          </select>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal('m-user')">Hủy</button>
        <button type="submit" class="btn btn-primary">💾 Lưu tài khoản</button>
      </div>
    </form>
  </div>
</div>

<script src="data.js"></script>
<script src="layout.js"></script>
<script>
const user = initPage('Tài khoản', 'users');
if (user.role !== 'giaovien') navigate('dashboard.html');

let filterRole = 'all';
let filterClassId = 'all';
let searchText = '';

function render() {
  const el = document.getElementById('page-content');
  let users = DB.users();
  const classes = DB.classes();

  const totalAll = users.length;
  const totalGV = users.filter(u => u.role === 'giaovien').length;
  const totalNT = users.filter(u => u.role === 'nhomt').length;
  const totalSV = users.filter(u => u.role === 'sinhvien').length;

  if (filterRole !== 'all') {
    users = users.filter(u => u.role === filterRole);
  }
  if (filterClassId !== 'all') {
    users = users.filter(u => u.role !== 'giaovien' && DB.userClassId(u) === filterClassId);
  }
  if (searchText) {
    const q = searchText.toLowerCase();
    users = users.filter(u =>
      u.name.toLowerCase().includes(q) ||
      u.email.toLowerCase().includes(q)
    );
  }

  el.innerHTML = `
    <div class="page-header-row">
      <div>
        <h1>⚙️ Quản lý tài khoản</h1>
        <p class="page-desc">${totalAll} tài khoản trong hệ thống · Phân theo từng lớp học</p>
      </div>
      <button class="btn btn-primary" onclick="openUserModal()">➕ Thêm tài khoản</button>
    </div>

    <!-- Bộ lọc theo Lớp học -->
    <div class="flex gap-2 mb-4" style="flex-wrap:wrap">
      <button class="btn ${filterClassId === 'all' ? 'btn-primary' : 'btn-secondary'} btn-sm" onclick="setClassFilter('all')">
        🌐 Tất cả các lớp (${totalAll})
      </button>
      ${classes.map(c => {
        const cnt = DB.studentsByClass(c.id).length;
        return `<button class="btn ${filterClassId === c.id ? 'btn-primary' : 'btn-secondary'} btn-sm" onclick="setClassFilter('${c.id}')">
          🏫 ${c.name} (${cnt} SV)
        </button>`;
      }).join('')}
    </div>

    <div class="stat-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:20px">
      <div class="stat-card">
        <div class="stat-icon si-black">👥</div>
        <div><div class="stat-val">${totalAll}</div><div class="stat-lbl">Tổng tài khoản</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon si-gray">👨‍🏫</div>
        <div><div class="stat-val">${totalGV}</div><div class="stat-lbl">Giảng viên</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon si-gray">👑</div>
        <div><div class="stat-val">${totalNT}</div><div class="stat-lbl">Nhóm trưởng</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon si-white">🎓</div>
        <div><div class="stat-val">${totalSV}</div><div class="stat-lbl">Sinh viên</div></div>
      </div>
    </div>

    <div class="card" style="margin-bottom:16px">
      <div class="flex items-center gap-3 flex-wrap">
        <div style="flex:1;min-width:200px">
          <input class="form-control" id="search-input" placeholder="🔍 Tìm theo họ tên hoặc email..."
            value="${searchText}" oninput="handleSearch(this.value)"/>
        </div>
        <div class="flex gap-2">
          ${[
            ['all', 'Tất cả'],
            ['giaovien', 'Giảng viên'],
            ['nhomt', 'Nhóm trưởng'],
            ['sinhvien', 'Sinh viên']
          ].map(([r, label]) => `
            <button class="btn ${filterRole === r ? 'btn-primary' : 'btn-secondary'} btn-sm"
              onclick="setFilter('${r}')">${label}</button>
          `).join('')}
        </div>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Họ và tên</th>
            <th>Email</th>
            <th>Vai trò</th>
            <th>Lớp học</th>
            <th>Nhóm dự án</th>
            <th>Mật khẩu</th>
            <th>Thao tác</th>
          </tr>
        </thead>
        <tbody>
          ${users.length === 0 ? `
            <tr><td colspan="8"><div class="empty"><div class="empty-icon">👤</div><p>Không tìm thấy tài khoản nào</p></div></td></tr>
          ` : users.map((u, idx) => {
            const group = DB.groupOfUser(u.id);
            const uCid = DB.userClassId(u);
            const cls = uCid ? DB.findClass(uCid) : null;
            return `<tr>
              <td class="text-muted">${idx + 1}</td>
              <td>
                <div class="flex items-center gap-2">
                  <div class="avatar" style="width:28px;height:28px;font-size:10px;background:${avatarBg(u.name)}">${getInitials(u.name)}</div>
                  <span class="font-semibold text-sm">${u.name}</span>
                  ${u.id === user.id ? '<span class="badge badge-black" style="font-size:9px">Bạn</span>' : ''}
                </div>
              </td>
              <td class="td-muted">${u.email}</td>
              <td>
                ${u.role === 'giaovien' ? '<span class="badge badge-black">GV</span>' :
                  u.role === 'nhomt' ? '<span class="badge badge-gray font-bold">NT</span>' :
                  '<span class="badge badge-outline">SV</span>'}
              </td>
              <td>
                ${u.role === 'giaovien'
                  ? '<span class="text-xs text-muted">Giảng viên</span>'
                  : (cls ? `<span class="badge badge-outline">🏫 ${cls.name}</span>` : '<span class="text-xs text-danger">Chưa chọn lớp</span>')}
              </td>
              <td>
                ${group ? `<span class="chip">${group.name}</span>` : '<span class="text-muted">Chưa có nhóm</span>'}
              </td>
              <td><span class="chip" style="font-family:monospace;letter-spacing:1px">••••••</span></td>
              <td>
                <div class="flex gap-1">
                  <button class="btn btn-secondary btn-sm" onclick="openUserModal('${u.id}')">✏️ Sửa</button>
                  ${u.id !== user.id ? `
                    <button class="btn btn-danger btn-sm btn-icon-sm" onclick="delUser('${u.id}')">🗑️</button>
                  ` : ''}
                </div>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;

  document.getElementById('search-input').oninput = e => { searchText = e.target.value; render(); };
}

window.handleSearch = function(val) { searchText = val; render(); };
window.setFilter = function(r) { filterRole = r; render(); };
window.setClassFilter = function(cid) { filterClassId = cid; render(); };

window.toggleRoleFields = function(role) {
  const wrap = document.getElementById('u-class-group-wrap');
  if (wrap) wrap.style.display = role === 'giaovien' ? 'none' : 'grid';
};

window.onUserClassChange = function(classId, selectedGroupId = '') {
  const groups = DB.groupsByClass(classId);
  const gSel = document.getElementById('u-group');
  gSel.innerHTML = '<option value="">-- Chưa phân nhóm --</option>' +
    groups.map(g => `<option value="${g.id}" ${selectedGroupId === g.id ? 'selected' : ''}>${g.name} – ${g.project}</option>`).join('');
};

window.openUserModal = function(uidVal = '') {
  const u = uidVal ? DB.findUserById(uidVal) : null;
  document.getElementById('m-user-title').textContent = u ? '✏️ Sửa tài khoản' : '➕ Thêm tài khoản mới';
  document.getElementById('u-id').value = uidVal;
  document.getElementById('u-name').value = u?.name || '';
  document.getElementById('u-email').value = u?.email || '';
  document.getElementById('u-pwd').value = '';
  const role = u?.role || 'sinhvien';
  document.getElementById('u-role').value = role;
  document.getElementById('pwd-hint').style.display = u ? 'inline' : 'none';
  toggleRoleFields(role);

  const classes = DB.classes();
  const curGrp = uidVal ? DB.groupOfUser(uidVal) : null;
  const defaultClassId = (u ? DB.userClassId(u) : null) || (filterClassId !== 'all' ? filterClassId : null) || DB.curClassId() || classes[0]?.id || '';

  const cSel = document.getElementById('u-class');
  cSel.innerHTML = classes.map(c => `<option value="${c.id}" ${c.id === defaultClassId ? 'selected' : ''}>${c.name} (${c.semester})</option>`).join('');

  onUserClassChange(defaultClassId, curGrp?.classId === defaultClassId ? curGrp.id : '');
  openModal('m-user');
};

window.saveUser = function(e) {
  e.preventDefault();
  const id = document.getElementById('u-id').value;
  const name = document.getElementById('u-name').value.trim();
  const email = document.getElementById('u-email').value.trim();
  const pwd = document.getElementById('u-pwd').value;
  const role = document.getElementById('u-role').value;
  const classId = role === 'giaovien' ? null : document.getElementById('u-class').value;
  const targetGid = role === 'giaovien' ? '' : document.getElementById('u-group').value;

  if (!name || !email) { showToast('Vui lòng nhập đầy đủ thông tin!', 'error'); return; }
  if (role !== 'giaovien' && !classId) { showToast('Vui lòng chọn Lớp học cho sinh viên!', 'error'); return; }

  const exist = DB.findUser(email);
  if (exist && exist.id !== id) {
    showToast('Email này đã được sử dụng!', 'error');
    return;
  }

  let finalId = id;
  if (id) {
    const upd = { id, name, email, role, classId };
    if (pwd) upd.password = pwd;
    DB.updateUser(upd);
    showToast('✅ Đã cập nhật tài khoản!', 'success');
  } else {
    if (!pwd) { showToast('Vui lòng nhập mật khẩu cho tài khoản mới!', 'error'); return; }
    finalId = uid();
    DB.addUser({ id: finalId, name, email, password: pwd, role, classId });
    showToast('✅ Đã thêm tài khoản mới vào lớp!', 'success');
  }

  // Xử lý phân vào nhóm (đảm bảo chỉ thuộc nhóm trong đúng lớp đã chọn)
  if (role !== 'giaovien') {
    const curGrp = DB.groupOfUser(finalId);
    if (curGrp && (curGrp.id !== targetGid || curGrp.classId !== classId)) {
      DB.updateGroup({ id: curGrp.id, members: curGrp.members.filter(m => m !== finalId) });
    }
    if (targetGid) {
      const targetGrp = DB.findGroup(targetGid);
      if (targetGrp && targetGrp.classId === classId && !targetGrp.members.includes(finalId)) {
        const updObj = { id: targetGid, members: [...targetGrp.members, finalId] };
        if (role === 'nhomt') updObj.leaderId = finalId;
        DB.updateGroup(updObj);
      }
    }
  }

  closeModal('m-user');
  render();
};

window.delUser = function(id) {
  const u = DB.findUserById(id);
  if (!confirm(`Xóa tài khoản ${u?.name || ''}?`)) return;
  DB.deleteUser(id);
  showToast('✅ Đã xóa tài khoản!', 'success');
  render();
};

render();
</script>
</body>
</html>
